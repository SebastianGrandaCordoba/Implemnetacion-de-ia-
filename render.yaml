services:
  - type: web
    name: fairteam-ai-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_MS
        value: "60000"
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_EXTRACTED_CHARS
        value: "30000"
