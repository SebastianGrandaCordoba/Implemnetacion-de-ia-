[project]
name = "fairteam-ai-service"
version = "1.2.0"
description = "Genera talleres y quizzes educativos a partir del material del docente."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt guidance is natural-language text sent to the model; wrapping it hurts readability.
"app/domain/prompt.py" = ["E501"]
